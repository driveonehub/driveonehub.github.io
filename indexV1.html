    border-color:#2196f3;

.tcgp-dropdown{
    position:absolute;
    z-index:99999;
    left:0;
    top:100%;
    margin-top:2px;

    border:1px solid #aaa;

/* =========================================================
   TÌM KIẾM TCGP
   ========================================================= */

function searchTCGP(keyword){

    const q = (keyword || "").toLowerCase().trim();

    if(!q){
        return TCGP_LIST;
    }

    return TCGP_LIST.filter(x =>

        x.mst.toLowerCase().includes(q) ||

        x.name.toLowerCase().includes(q) ||

        x.keywords.toLowerCase().includes(q)

    );
}


/* =========================================================
   TT32 SUPPORT
   ========================================================= */

function getFirst(xml, tags){

    for(const t of tags){

        const el = xml.getElementsByTagName(t)[0];

        if(el && el.textContent){

            const v = el.textContent.trim();

            if(v) return v;

        }

    }

    return "";
}


function getSellerInfoTT32(xml){

    const sellerSelectors = [
        "NBan",
        "Seller",
        "seller",
        "inv:Seller"
    ];

    const MSTNBan_TT32 = [
        "MST",
        "NBMST",
        "MaSoThueNguoiBan",
        "ma_thue",
        "MSTTinh",
        "ComTaxCode",
        "sellerTaxCode",
        "inv:sellerTaxCode",
        "Taxcode",
        "SellerTaxCode",
        "CompanyTaxCode",
        "Tax_File_Number",
        "sellerVATID"
    ];

    const TenNBan_TT32 = [
        "Ten",
        "TenNguoiBan",
        "don_vi",
        "tenDVi",
        "ComName",
        "sellerLegalName",
        "inv:sellerLegalName",
        "CompanyName",
        "SellerName",
        "inv:SellerName",
        "CustomerName",
        "Pr_Detail_Name",
        "sellerCompanyName"
    ];

    let result = {
        tax:"",
        name:""
    };


    for(const s of sellerSelectors){

        const node = xml.getElementsByTagName(s)[0];

        if(node){

            if(!result.tax){
                result.tax = getFirst(
                    node.ownerDocument || xml,
                    MSTNBan_TT32
                );
            }

            if(!result.name){
                result.name = getFirst(
                    node.ownerDocument || xml,
                    TenNBan_TT32
                );
            }

        }

        if(result.tax && result.name) break;

    }


    if(!result.tax){
        result.tax = getFirst(xml, MSTNBan_TT32);
    }

    if(!result.name){
        result.name = getFirst(xml, TenNBan_TT32);
    }

    return result;
}


function getCDATA(xml, tagName){

    const nodes = xml.getElementsByTagName("inv:userDefines");

    if(!nodes.length) return "";

    const text = nodes[0].textContent || "";

    const match = text.match(
        new RegExp(
            `<${tagName}>\\s*([^<]+)\\s*<\\/${tagName}>`,
            "i"
        )
    );

    return match ? match[1].trim() : "";
}


function detectProviderByContent(xml, rawText){

    const g = t =>
        xml.getElementsByTagName(t)[0]?.textContent?.trim() || "";

    const systemCode =
        g("inv:systemCode") ||
        g("systemCode");


    if(systemCode === "LHD_MISA"){
        return "0101243150";
    }

    if(systemCode === "LHD_EFY"){
        return "0102519041";
    }

    if(
        g("inv:invoiceAppRecordId") ||
        g("inv:invoiceAppRecordID")
    ){
        return "0101360697";
    }

    if(
        g("chungTuLienQuan") ||
        g("ChungTuLienQuan")
    ){
        return "0306731335";
    }

    if(
        g("Hilo-SearchKey") ||
        g("Hilo-Searchkey")
    ){
        return "0106713804";
    }


    if(
        /<DLieu\b[\s\S]*?<\/DLieu>\s*<KDLieu\b[\s\S]*?<\/KDLieu>\s*<TTruong>\s*Mã\s*số\s*bí\s*mật\s*<\/TTruong>/i
        .test(rawText)
    ){
        return "0100109106";
    }


    const txt = rawText.toLowerCase();


    if(txt.includes("meinvoice.vn")){
        return "0101243150";
    }

    if(txt.includes("ehoadon.vn")){
        return "0101360697";
    }

    if(txt.includes("vnpt-invoice.com.vn")){
        return "0100684378";
    }

    if(
        txt.includes("sinvoice.viettel.vn") ||
        txt.includes("vinvoice.viettel.vn")
    ){
        return "0100109106";
    }

    if(
        txt.includes("einvoice.vn") ||
        txt.includes("einvoice.com.vn")
    ){
        return "0101300842";
    }

    if(
        txt.includes("easyinvoice.vn") ||
        txt.includes("easyinvoice.com.vn")
    ){
        return "0105987432";
    }

    if(txt.includes("minvoice.com.vn")){
        return "0106026495";
    }

    if(txt.includes("smartvas.vn")){
        return "0309612872";
    }

    if(txt.includes("xuathoadon.vn")){
        return "0309478306";
    }

    if(txt.includes("einvoice.fast.com.vn")){
        return "0100727825";
    }

    if(txt.includes("ihoadon.vn")){
        return "0102519041";
    }

    if(txt.includes("hilo-searchkey")){
        return "0106713804";
    }

    if(txt.includes("cinvoice.vn")){
        return "0101925883";
    }

    return "";
}

/* =========================================================
   PARSE XML
   ========================================================= */

function parseXML(txt,name){

    const xml =
        new DOMParser().parseFromString(txt,"text/xml");


    /* ===== kiểm tra XML lỗi ===== */

    if(xml.getElementsByTagName("parsererror").length){

        document.getElementById("result").innerHTML += `
            <div class="block">
                <b>File:</b> ${escapeHTML(name)}<br><br>
                <span style="color:red">
                    File XML không hợp lệ hoặc không thể đọc.
                </span>
            </div>
        `;

        return;
    }


    const g = t =>
        xml.getElementsByTagName(t)[0]?.textContent.trim() || "";


    const c = (p,t) =>
        p?.getElementsByTagName(t)[0]?.textContent.trim() || "";


    /* ===== TT78 ===== */

    const KHMSHDon_TT78 = g("KHMSHDon");
    const KHHDon_TT78 = g("KHHDon");
    const SHDon_TT78 = g("SHDon");

    const NLap_TT78 = g("NLap");
    const MHSo = g("MHSo");

    const MCCQT = g("MCCQT");
    const MTDTChieu = g("MTDTChieu");
    const TgTTTBSo = g("TgTTTBSo");


    /* ===== TT32 FALLBACK ===== */

    const KHMSHDon_TT32 = getFirst(
        xml,
        [
            "KHMSHDon",
            "MSHDon",
            "MauSo",
            "mau_sovat",
            "mauHDon",
            "InvoicePattern",
            "templateCode",
            "inv:templateCode",
            "TemptCode",
            "InvoiceForm",
            "Prints_Id"
        ]
    );


    const KHHDon_TT32 = getFirst(
        xml,
        [
            "KHHDon",
            "Kyhieu",
            "seri_vat",
            "kyHieuHDon",
            "SerialNo",
            "invoiceSeries",
            "inv:invoiceSeries",
            "Symbol",
            "InvoiceSerial",
            "Vat_Tran_Serie"
        ]
    );


    const SHDon_TT32 = getFirst(
        xml,
        [
            "SHDon",
            "SoHoaDon",
            "so_hoadon",
            "soHDon",
            "InvoiceNo",
            "invoiceNo",
            "invoiceNumber",
            "InvoiceNumber",
            "inv:invoiceNumber",
            "Vat_Tran_No"
        ]
    );


    const NLap_TT32 = getFirst(
        xml,
        [
            "TDLap",
            "NgayHoaDon",
            "ngay_hdon",
            "ngayHDon",
            "ArisingDate",
            "invoiceDate",
            "invoiceIssuedDate",
            "inv:invoiceIssuedDate",
            "DateofInvoice",
            "InvoiceDate",
            "Vat_Tran_Date"
        ]
    );


    const KHMSHDon =
        KHMSHDon_TT78 ||
        KHMSHDon_TT32;

    const KHMSHDonV =
        KHMSHDon.replace(/\//g,"");


    const KHHDon =
        KHHDon_TT78 ||
        KHHDon_TT32;

    const KHHDonV =
        KHHDon.replace(/\//g,"");


    const SHDon =
        SHDon_TT78 ||
        SHDon_TT32;

    const SHDonV =
        SHDon.replace(/^0+/,"");


    const NLap =
        NLap_TT78 ||
        NLap_TT32;


    /* ===== TCGP TỰ NHẬN DIỆN ===== */

    let MSTTCGP_AUTO =
        g("MSTTCGP") ||
        g("MSTDVCCHDDTu");


    if(!MSTTCGP_AUTO){

        MSTTCGP_AUTO =
            detectProviderByContent(xml,txt);

    }


    /*
     * Nếu không nhận diện được:
     * dùng VNPT_BACK như code cũ.
     *
     * Nhưng vẫn lưu MSTTCGP_AUTO riêng để
     * biết đây là tự động nhận diện hay mặc định VNPT.
     */

    const MSTTCGP =
        MSTTCGP_AUTO ||
        "VNPT_BACK";


    /* ===== NGƯỜI BÁN ===== */

    const NBan =
        xml.querySelector("NDHDon > NBan");


    const TenNBan_TT78 =
        c(NBan,"Ten");


    const MSTNBan_TT78 =
        c(NBan,"MST");


    /* ===== TT32 MST FALLBACK ===== */

    const sellerInfo =
        getSellerInfoTT32(xml);


    const TenNBan =
        TenNBan_TT78 ||
        sellerInfo.name;


    const MSTNBan =
        MSTNBan_TT78 ||
        sellerInfo.tax;


    /* ===== TÊN GỢI NHỚ ===== */

    const TenNBanGoiNho =
        (
            typeof TENNBANGOINHO !== "undefined" &&
            TENNBANGOINHO[MSTNBan]
        )
        ?
        TENNBANGOINHO[MSTNBan]
        :
        TenNBan;


    const TenNBanGoiNhoFinal =
        (TenNBanGoiNho || "")
        .replace(
            /\b(công ty|cổ phần|tnhh|một thành viên|mtv|hộ kinh doanh)\b/gi,
            ""
        )
        .replace(/\s+/g," ")
        .trim();


    /* ===== NGƯỜI MUA ===== */

    const NMua =
        xml.querySelector("NDHDon > NMua");


    const TenNMua =
        c(NMua,"Ten");


    const MSTNMua =
        c(NMua,"MST");


    /* ===== CHỮ KÝ ===== */

    const DSCKS =
        xml.querySelector("DSCKS");


    const NKyNBan =
        c(
            DSCKS?.querySelector("NBan"),
            "SigningTime"
        );


    const NKyNMua =
        c(
            DSCKS?.querySelector("NMua"),
            "SigningTime"
        );


    const NKyCQT =
        c(
            DSCKS?.querySelector("CQT"),
            "SigningTime"
        );


    /* ===== ID HÓA ĐƠN ===== */

    const DLHDon =
        xml.querySelector("DLHDon");


    const IDHDon1 =
        DLHDon?.getAttribute("Id") || "";


    const IDHDon2 =
        IDHDon1.includes("-")
        ?
        IDHDon1.split("-").pop()
        :
        "";


    const IDHDon3 =
        IDHDon1.includes("_")
        ?
        IDHDon1.split("_").pop()
        :
        "";


    let IDHDon4 = "";


    if(IDHDon1.length >= 10){

        const p =
            IDHDon1.length - 10;

        IDHDon4 =
            IDHDon1.slice(0,p) +
            "_" +
            IDHDon1.slice(p);

    }


    const IDHDon5 =
        IDHDon4.replace(/\D/g,"")
        ?
        (
            BigInt(
                IDHDon4.replace(/\D/g,"")
            ) + 1n
        ).toString()
        :
        "";


    const DigestValue =
        xml.getElementsByTagName("DigestValue")[0]
        ?.textContent.trim() || "";


    /* ===== NGÀY ===== */

    const formatDate = d => {

        if(!d) return "";

        const dt =
            new Date(
                d.includes("/")
                ?
                d.split("/").reverse().join("-")
                :
                d
            );


        if(isNaN(dt)) return d;


        const y =
            dt.getFullYear();


        const m =
            String(dt.getMonth()+1)
            .padStart(2,"0");


        const day =
            String(dt.getDate())
            .padStart(2,"0");


        return `${y}-${m}-${day}`;
    };


    /* ===== MÃ TRA CỨU ===== */

    let MaTCHdon =
        g("MaTC") ||
        g("Fkey") ||
        getCDATA(xml,"TransactionID");


    if(!MaTCHdon){

        MaTCHdon =
            getFirst(
                xml,
                [
                    "sobaomat",
                    "SoBaoMat",
                    "SOBAOMAT",
                    "invoice_id",
                    "InvoiceId",
                    "InvoiceID",
                    "Key",
                    "key",
                    "publicCode",
                    "PublicCode",
                    "TransactionID",
                    "TransactionId",
                    "transactionId",
                    "InvoiceCode",
                    "Invoicecode",
                    "invoiceCode",
                    "chungTuLienQuan",
                    "inv:invoiceAppRecordId"
                ]
            );

    }


    /* ===== LINK TRẢ VỀ TRONG XML ===== */

    let LinkTCHdon =
        g("Link") ||
        g("LinkTC");


    xml.querySelectorAll("TTin").forEach(t => {

        const key =
            c(t,"TTruong");


        const val =
            c(t,"DLieu");


        if(
            !MaTCHdon &&
            KEY_TTRUONG.includes(key)
        ){
            MaTCHdon = val;
        }


        if(
            !LinkTCHdon &&
            LINK_TTRUONG.includes(key)
        ){
            LinkTCHdon = val;
        }

    });


    /* =====================================================
       LƯU DỮ LIỆU RIÊNG CHO HÓA ĐƠN
       ===================================================== */

    const invoiceId =
        "invoice_" +
        Math.random()
        .toString(36)
        .substring(2,10);


    const invoiceData = {

        MaTCHdon,
        MCCQT,

        MSTNBan,
        MSTNMua,

        SHDonV,

        KHMSHDon,
        KHHDon,

        MHSo,

        TgTTTBSo,

        LinkTCHdon,

        IDHDon1,
        IDHDon2,
        IDHDon3,
        IDHDon4,
        IDHDon5,

        MSTTCGP_AUTO,

        TenNBan,
        TenNBanGoiNhoFinal,

        formatDateNLap:
            formatDate(NLap),

        name

    };


    window.invoiceDataStore[invoiceId] =
        invoiceData;


    /* ===== TCGP HIỂN THỊ ===== */

    const tcgpDisplay =
        TCGP_LIST.find(
            x => x.mst === MSTTCGP
        );


    const tcgpValue =
        tcgpDisplay
        ?
        `${tcgpDisplay.name} - ${tcgpDisplay.mst}`
        :
        `VNPT (mặc định) - VNPT_BACK`;


    const autoText =
        MSTTCGP_AUTO
        ?
        `<span class="tcgp-auto">Tự nhận diện</span>`
        :
        `<span class="tcgp-warning">
            Không nhận diện → đang dùng VNPT
        </span>`;


    /* ===== TẠO LINK LẦN ĐẦU ===== */

    const links =
        buildInvoiceLinks(
            MSTTCGP,
            invoiceData
        );


    /* =====================================================
       HTML HÓA ĐƠN
       ===================================================== */

    let html = `

<div
    class="block invoice-block"
    data-invoice-id="${invoiceId}"
>

<b>File:</b>
${escapeHTML(name)}
<br><br>

Mẫu số - ký kiệu:
${escapeHTML(KHMSHDon)}
 -
${escapeHTML(KHHDon)}
<br>

Số hóa đơn:
${escapeHTML(SHDon)}
<br>

Ngày hóa đơn:
${escapeHTML(NLap)}
<br>

Ngày ký hóa đơn:
${escapeHTML(NKyNBan)}
<br>

Ngày CQT ký hóa đơn:
${escapeHTML(NKyCQT)}
<br>

MST - Tên người bán:
${escapeHTML(MSTNBan)}
 -
${escapeHTML(TenNBan)}
<br>

Mã CQT:
${escapeHTML(MCCQT)}
<br>


<div class="tcgp-box">

    <span class="tcgp-label">
        TCGP:
    </span>

    <div class="tcgp-search-wrap">

        <input
            type="text"
            class="tcgp-search"
            value="${escapeHTML(tcgpValue)}"
            placeholder="Nhập MST hoặc tên TCGP..."
            autocomplete="off"
            data-auto-mst="${escapeHTML(MSTTCGP_AUTO || "VNPT_BACK")}"
            data-current-mst="${escapeHTML(MSTTCGP)}"
        >

        <div class="tcgp-dropdown"></div>

    </div>

    ${autoText}

    <button
        type="button"
        class="copy-btn tcgp-reset"
    >
        Tự nhận diện
    </button>

</div>


<div class="invoice-links">

    <b>Thông tin tra cứu hóa đơn:</b>
    <br>
`;


    /* ===== HIỂN THỊ LINK ===== */

    if(!links.length){

        html += `
            Chưa có thông tin tra cứu hóa đơn
            của nhà cung cấp mã số thuế
            ${escapeHTML(MSTTCGP)}
        `;


        if(
            MSTTCGP &&

        ){

            html += `
                <br>

            `;

            ].includes(MSTTCGP)
        ){

            html += `
                <br>
                Không tồn tại mã tra cứu trong file XML
            `;

        }

    }


    html += `

</div>

<br>

Tên file:
<span class="file-name">
    ${escapeHTML(formatDate(NLap))}
    ${escapeHTML(MSTNBan)}

/* =========================================================

function applyTCGPToInvoice(
    block,
    newMSTTCGP
){

    if(!block) return;


    const invoiceId =
        block.dataset.invoiceId;


    const invoiceData =
        window.invoiceDataStore[invoiceId];


    if(!invoiceData){

        console.warn(
            "Không tìm thấy dữ liệu hóa đơn:",
            invoiceId
        );

        return;

    }


    const links =
        buildInvoiceLinks(
            newMSTTCGP,
            invoiceData
        );


    const linksBox =
        block.querySelector(
            ".invoice-links"
        );


    if(!linksBox) return;


    let html = `
        <b>Thông tin tra cứu hóa đơn:</b>
        <br>
    `;


    if(!links.length){

        html += `
            Chưa có thông tin tra cứu hóa đơn
            của nhà cung cấp mã số thuế
            ${escapeHTML(newMSTTCGP)}
        `;


        if(!invoiceData.MaTCHdon){

            html += `
                <br>
                Không tồn tại mã tra cứu trong file XML
            `;

        }

    }

    else{

        links.forEach(l => {

            if(
                typeof l === "string" &&
                l.startsWith("http")
            ){

                html += `
                    <a
                        href="${escapeAttribute(l)}"
                        target="_blank"
                        rel="noopener noreferrer"
                    >${escapeHTML(l)}</a>
                `;

            }

            else{

                html += l;

            }

        });


        if(
            !invoiceData.MaTCHdon &&
            ![
                "0101243150",
                "0101360697"
            ].includes(newMSTTCGP)
        ){

            html += `
                <br>
                Không tồn tại mã tra cứu trong file XML
            `;

        }

    }


    linksBox.innerHTML = html;


    /* cập nhật trạng thái TCGP */

    const input =
        block.querySelector(
            ".tcgp-search"
        );


    if(input){

        input.dataset.currentMst =
            newMSTTCGP;

    }


    /* cập nhật dòng trạng thái */

    const oldStatus =
        block.querySelector(
            ".tcgp-auto,.tcgp-warning"
        );


    if(oldStatus){

        oldStatus.remove();

    }


    const tcgpInfo =
        TCGP_LIST.find(
            x => x.mst === newMSTTCGP
        );


    const status =
        document.createElement("span");


    status.className =
        "tcgp-auto";


    status.textContent =
        "Đã chọn";


    if(input){

        input.parentElement
            .insertAdjacentElement(
                "afterend",
                status
            );

    }

}


/* =========================================================
   TCGP SEARCH DROPDOWN
   ========================================================= */

function renderTCGPDropdown(input){

    const dropdown =
        input.parentElement
            .querySelector(
                ".tcgp-dropdown"
            );


    const keyword =
        input.value;


    /*
     * Nếu ô đang chứa:
     *
     * BKAV - 0101360697
     *
     * thì lấy luôn phần đó để tìm.
     */

    const results =
        searchTCGP(keyword);


    dropdown.innerHTML = "";


    if(!results.length){

        dropdown.innerHTML = `
            <div class="tcgp-empty">
                Không tìm thấy TCGP
            </div>
        `;

        dropdown.style.display =
            "block";

        return;

    }


    results
        .slice(0,50)
        .forEach(item => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "tcgp-item";


            div.innerHTML = `
                <div class="tcgp-name">
                    ${escapeHTML(item.name)}
                </div>

                <div class="tcgp-mst">
                    ${escapeHTML(item.mst)}
                </div>
            `;


            div.addEventListener(
                "mousedown",
                function(e){

                    /*
                     * mousedown dùng thay click
                     * để tránh input blur trước
                     * khi chọn item.
                     */

                    e.preventDefault();


                    input.value =
                        `${item.name} - ${item.mst}`;


                    input.dataset.currentMst =
                        item.mst;


                    dropdown.style.display =
                        "none";


                    const block =
                        input.closest(
                            ".invoice-block"
                        );


                    applyTCGPToInvoice(
                        block,
                        item.mst
                    );

                }
            );


            dropdown.appendChild(div);

        });


    dropdown.style.display =
        "block";
}

/* =========================================================
   COPY TÊN FILE
   ========================================================= */

function copyText(btn){

    const text =
        btn.parentElement
            .querySelector(
                ".file-name"
            )
            .innerText;


    navigator.clipboard
        .writeText(text)
        .then(() => {

            btn.innerText =
                "Đã copy";


            setTimeout(
                () => {
                    btn.innerText =
                        "Copy";
                },
                1500
            );

        })
        .catch(() => {

            /*
             * fallback nếu clipboard bị
             * trình duyệt chặn
             */

            const ta =
                document.createElement(
                    "textarea"
                );

            ta.value = text;

            document.body
                .appendChild(ta);

            ta.select();

            document.execCommand(
                "copy"
            );

            ta.remove();

            btn.innerText =
                "Đã copy";


            setTimeout(
                () => {
                    btn.innerText =
                        "Copy";
                },
                1500
            );

        });

}

            e.target.classList.contains(
                "file-name"
            )
        ){

            const text =
                e.target.innerText;


            navigator.clipboard
                .writeText(text)
                .catch(() => {

                    const ta =
                        document.createElement(
                            "textarea"
                        );

                    ta.value = text;

                    document.body
                        .appendChild(ta);

                    ta.select();

                    document.execCommand(
                        "copy"
                    );

                    ta.remove();

                });

        }

    }
);


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function escapeAttribute(value){

    return escapeHTML(value);

}


/* =========================================================
   DASHBOARD TAB ACTIVE
   ========================================================= */

(function(){

    const tabs =
        document.querySelectorAll(
            ".tab"
        );


    const params =
        new URLSearchParams(
            window.location.search
        );


    let activeTab =
        "lookup";


    if(params.get("page")){

        activeTab =
            params.get("page");

    }


    tabs.forEach(t => {

        if(
            t.dataset.tab ===
            activeTab
        ){

            t.classList.add(
                "active"
            );

        }

    });

})();

</script>
